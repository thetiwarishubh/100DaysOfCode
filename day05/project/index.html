    <title>Employee Info Card</title>

        <div>
          <ul class="ul-tag">

            <li>Blood <strong>:</strong> AB-</li>
            <li>Email <strong>:</strong>Shubham@example.com</li>
            <li>Phone <strong>:</strong> 9876543210</li>
          </ul>
        </div>
      </div>
    </div>
  </body>
</html>
